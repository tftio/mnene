name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-plz:
    uses: tftio/gh-actions/.github/workflows/release-plz.yml@v2.3.2
    with:
      app-id: ${{ vars.RELEASE_BOT_APP_ID }}
    secrets:
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
