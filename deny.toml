[graph]
all-features = true

[advisories]
git-fetch-with-cli = true
# A yanked crate in the lockfile is a build that cannot be reproduced: the
# committed lock still resolves, but any fresh resolution -- `cargo install
# --git` without `--locked`, or a new contributor's first build -- fails with no
# valid version to pick. cargo-deny only warns by default, so a yanked
# dependency can pass CI and fail the next fresh install. This repository is
# installed from git without a tag, so a fresh resolve is the normal path, not
# an edge case. Fail instead.
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MPL-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OpenSSL",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# INVARIANT-BYPASS(RS-009): RS-009 (refines ENG-014) bans serde_json because
# JSON is never this repo's canonical format. This project keeps a single
# compatibility boundary that needs it anyway: the stdio MCP transport
# (src/mcp.rs) and the CLI's --json output flag (src/main.rs), because MCP is
# JSON-RPC and --json serves external tools. serde_json is confined to those two
# edge modules; no other module may import it.

skip = [
  { crate = "windows-sys" },
  { crate = "windows-targets" },
  { crate = "windows_aarch64_gnullvm" },
  { crate = "windows_aarch64_msvc" },
  { crate = "windows_i686_gnu" },
  { crate = "windows_i686_msvc" },
  { crate = "windows_x86_64_gnu" },
  { crate = "windows_x86_64_gnullvm" },
  { crate = "windows_x86_64_msvc" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
